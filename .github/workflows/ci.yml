name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and dataset validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Validate dataset
        run: python -m telugu_eval validate

  deploy:
    name: Build and deploy leaderboard
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The account id is not sensitive, so a repository variable works too.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      # Repository variable; set to "all" to publish preliminary results that include drafts.
      LEADERBOARD_SPLIT: ${{ vars.LEADERBOARD_SPLIT || 'reviewed' }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'telugu-llm-eval' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build site data (offline, from committed runs/)
        run: python -m telugu_eval build-site --split "$LEADERBOARD_SPLIT"
      - name: Check Cloudflare settings (names only, never values)
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo "CLOUDFLARE_API_TOKEN: set" || echo "::warning::CLOUDFLARE_API_TOKEN is missing. Add it under Settings > Secrets and variables > Actions > Repository secrets."
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "CLOUDFLARE_ACCOUNT_ID: set" || echo "::warning::CLOUDFLARE_ACCOUNT_ID is missing. Add it as a repository secret or variable."
          echo "Pages project: $PAGES_PROJECT · leaderboard split: $LEADERBOARD_SPLIT"
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true
